<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的博客</title>
    <!-- Marked 用于 Markdown 解析 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- highlight.js 用于代码高亮 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
        body {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: #333;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px solid #eee;
        }
        .post-list {
            list-style: none;
            padding: 0;
        }
        .post-item {
            margin-bottom: 20px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            transition: box-shadow 0.2s;
        }
        .post-item:hover {
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .post-title {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .post-title a {
            text-decoration: none;
            color: #2c3e50;
        }
        .post-title a:hover {
            color: #3498db;
        }
        .post-meta {
            color: #666;
            font-size: 0.9em;
        }
        .post-description {
            margin-bottom: 5px;
            line-height: 1.4;
        }
        .post-date {
            font-size: 0.85em;
            color: #888;
        }
        .no-posts {
            text-align: center;
            color: #666;
            font-style: italic;
            margin-top: 40px;
        }

        /* 单篇文章样式 */
        .back-link {
            display: inline-block;
            margin-bottom: 15px;
            color: #3498db;
            text-decoration: none;
            font-size: 0.9em;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .content {
            margin-top: 30px;
        }
        .content h1, .content h2, .content h3, .content h4, .content h5, .content h6 {
            color: #2c3e50;
        }
        .content h1 {
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }
        .content pre {
            background: #f6f8fa;
            padding: 16px;
            border-radius: 6px;
            overflow-x: auto;
        }
        .content blockquote {
            border-left: 4px solid #dfe2e5;
            padding-left: 16px;
            margin-left: 0;
            color: #6a737d;
        }
        .content img {
            max-width: 100%;
            height: auto;
        }
        .content table {
            border-collapse: collapse;
            width: 100%;
            margin: 20px 0;
        }
        .content th, .content td {
            border: 1px solid #dfe2e5;
            padding: 8px 12px;
            text-align: left;
        }
        .content th {
            background-color: #f6f8fa;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 id="page-title">我的博客</h1>
        <p id="page-subtitle">从 markdown 文件生成的静态博客</p>
    </div>

    <div id="app"></div>

    <script>
        // ========================= 配置区域 =========================
        // 文章索引文件路径
        const POSTS_INDEX = './posts/index.json';
        // 文章目录路径
        const POSTS_DIR = './posts/';

        // ========================= 工具函数 =========================
        const app = document.getElementById('app');

        async function fetchJSON(url) {
            const res = await fetch(url);
            if (!res.ok) throw new Error(`网络请求失败: ${res.status}`);
            return await res.json();
        }

        function createElement(tag, attrs = {}, children = []) {
            const el = document.createElement(tag);
            for (const [k, v] of Object.entries(attrs)) {
                if (k === 'class') {
                    el.className = v;
                } else if (k === 'html') {
                    el.innerHTML = v;
                } else {
                    el.setAttribute(k, v);
                }
            }
            (Array.isArray(children) ? children : [children]).forEach(child => {
                if (typeof child === 'string') {
                    el.appendChild(document.createTextNode(child));
                } else if (child) {
                    el.appendChild(child);
                }
            });
            return el;
        }

        function setContent(node) {
            app.innerHTML = '';
            app.appendChild(node);
            window.scrollTo({ top: 0 });
        }

        // ========================= 列表页 =========================
        async function renderPostList() {
            try {
                const posts = await fetchJSON(POSTS_INDEX);

                if (posts.length === 0) {
                    setContent(createElement('div', { class: 'no-posts', html: '还没有文章。请在 <code>posts/</code> 目录下添加 markdown 文件并更新 index.json。' }));
                    return;
                }

                const list = createElement('ul', { class: 'post-list' });
                posts.forEach(post => {
                    const li = createElement('li', { class: 'post-item' });
                    const link = createElement('a', { href: `?file=${encodeURIComponent(post.filename)}` }, post.title);
                    li.appendChild(createElement('div', { class: 'post-title' }, link));
                    
                    // 添加描述和日期
                    const meta = createElement('div', { class: 'post-meta' });
                    if (post.description) {
                        meta.appendChild(createElement('div', { class: 'post-description' }, post.description));
                    }
                    if (post.date) {
                        meta.appendChild(createElement('div', { class: 'post-date' }, `发布日期: ${post.date}`));
                    }
                    li.appendChild(meta);
                    
                    list.appendChild(li);
                });

                setContent(list);
            } catch (err) {
                console.error(err);
                setContent(createElement('div', { class: 'no-posts', html: '获取文章列表失败。请检查 posts/index.json 文件是否存在。' }));
            }
        }

        // ========================= 文章页 =========================
        async function renderPost(filename) {
            try {
                const postUrl = POSTS_DIR + filename;
                const res = await fetch(postUrl);
                if (!res.ok) throw new Error('文章加载失败');
                const markdown = await res.text();

                const htmlContent = marked.parse(markdown, {
                    highlight: function(code, lang) {
                        if (lang && hljs.getLanguage(lang)) {
                            return hljs.highlight(code, { language: lang }).value;
                        }
                        return hljs.highlightAuto(code).value;
                    }
                });
                
                // 获取文章标题
                const posts = await fetchJSON(POSTS_INDEX);
                const post = posts.find(p => p.filename === filename);
                const title = post ? post.title : filename.replace(/\.md$/, '');
                
                const container = createElement('div', {}, [
                    createElement('a', { class: 'back-link', href: './' }, '← 返回首页'),
                    createElement('article', { class: 'content', html: htmlContent })
                ]);
                setTimeout(() => hljs.highlightAll(), 0);
                setContent(container);
                document.title = title + ' - 我的博客';
            } catch (err) {
                console.error(err);
                setContent(createElement('div', { class: 'no-posts', html: '文章加载失败。请检查文件是否存在。' }));
            }
        }

        // ========================= 路由处理 =========================
        function router() {
            const params = new URLSearchParams(location.search);
            const file = params.get('file');
            if (file) {
                renderPost(file);
            } else {
                renderPostList();
            }
        }

        window.addEventListener('popstate', router);

        router();
    </script>
</body>
</html>
